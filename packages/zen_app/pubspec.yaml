name: zen_app
description: >-
  Zen: a personal Zen To Done companion. Flutter UI, Riverpod providers,
  routing, theming and platform glue (ZEN_SPEC.md §11.7).

  The android/ and windows/ platform folders are generated with
  `flutter create --platforms=windows,android .` in M4; see DECISIONS.md.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  zen_data:
    path: ../zen_data
  zen_domain:
    path: ../zen_domain
  zen_sync:
    path: ../zen_sync

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift: ^2.35.0

flutter:
  uses-material-design: true
