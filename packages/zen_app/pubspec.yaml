name: zen_app
description: >-
  Zen: a personal Zen To Done companion. Flutter UI, Riverpod providers,
  routing, theming and platform glue (ZEN_SPEC.md §11.7).

  The android/ and windows/ platform folders are generated with
  `flutter create --platforms=windows,android .` in M4; see DECISIONS.md.
publish_to: none
# SPEC 11.9. The one version number: `x.y.z` is the Inno Setup installer
# version, the APK `versionName` and what SET-3's About row shows; the integer
# after `+` is the APK `versionCode`.
#
# `versionCode` MUST NEVER DECREASE. Android rejects a lower one outright, and
# the only way past that refusal is to uninstall, which destroys the local
# database. Increment it on every release that leaves this machine.
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  device_info_plus: ^13.2.0
  # §11.6.3, §11.7. The desktop folder picker.
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  # §11.2, §11.6.4. QR scanning on the phone's pairing screen. Android, iOS,
  # macOS and web only — there is no Windows implementation, which is why the
  # scan screen is reached on Android alone and the desktop types nothing.
  mobile_scanner: ^7.4.2
  # §11.2, §11.6.4. mDNS: the desktop registers `_zen-sync._tcp`, the phone
  # browses. `nsd` is the one §11.2 requires because it does **both**, and its
  # federated implementations include Windows as well as Android.
  nsd: ^5.0.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  # §11.2, §11.6.4. The desktop pairing screen's QR code. Pure Dart rendering,
  # so it works on both platforms.
  qr_flutter: ^4.1.0
  # §11.6.3, §11.7. Android scoped storage. `saf_util` picks the tree and does
  # the directory operations; it deliberately excludes read and write, which is
  # why `saf_stream` is here too — §11.2 anticipated the pair.
  saf_stream: ^4.0.1
  saf_util: ^3.1.0
  zen_data:
    path: ../zen_data
  zen_domain:
    path: ../zen_domain
  zen_sync:
    path: ../zen_sync

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift: ^2.35.0

flutter:
  uses-material-design: true
